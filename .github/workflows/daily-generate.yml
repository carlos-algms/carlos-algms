name: Daily Generate

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          # persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.24.1'
          cache-dependency-path: scraper/go.sum

      - name: Cache binary
        id: cache_binary
        uses: actions/cache@v4
        with:
          path: scraper/scraper
          key: binary-${{ hashFiles('scraper/**/*.go', 'scraper/go.mod', 'scraper/go.sum') }}

      - name: Build the Scraper
        if: steps.cache_binary.outputs.cache-hit != 'true'
        run: make build

      - name: Restore executable permission
        if: steps.cache_binary.outputs.cache-hit == 'true'
        run: chmod +x scraper/scraper

      # Cache data.hash to persist between workflow runs
      # This hash is generated from GitHub API responses and used to detect if data has changed
      # Using restore-keys fallback to get latest cache, and unique key per run to save updates
      # This prevents unnecessary commits when GitHub API returns identical data
      - name: Restore Github data hash
        id: cache_data_restore
        uses: actions/cache/restore@v4
        with:
          path: scraper/data.hash
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-

      - name: Run Make generate
        run: make generate

      - name: Save Github data hash
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/data.hash
          key: data-cache-${{ github.run_id }}

      - name: Check for changes and add timestamp
        id: check_changes
        # Compare README content excluding timestamp comments
        run: |
          if diff -q \
            <(grep -v "^<!-- Generated on" README.md) \
            <(git show HEAD:README.md | grep -v "^<!-- Generated on") \
            > /dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            echo "<!-- Generated on $(date -u '+%Y-%m-%d %H:%M:%S') -->" >> README.md
          fi

      # Keep this artifact upload - it's for manual inspection via GitHub UI, not related to cache
      - name: Upload cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: data-cache
          path: scraper/data.hash
          retention-days: 90

      - name: Configure Git
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        if: steps.check_changes.outputs.changed == 'true'
        # env:
        # GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          git add .
          git commit -m "Automated update: $(date) [skip ci]"
          git push