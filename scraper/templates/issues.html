{{ range .Issues }}
<p>
  <a href="{{ .URL }}">
    {{- if eq .State "closed" -}}
      <img
        src="https://raw.githubusercontent.com/carlos-algms/carlos-algms/refs/heads/main/images/issue-closed.svg"
        width="20"
        height="20"
        alt="issue closed"
        title="Issue closed"
      />
    {{- else -}}
      <img
        src="https://raw.githubusercontent.com/carlos-algms/carlos-algms/refs/heads/main/images/issue-open.svg"
        width="20"
        height="20"
        alt="issue open"
        title="Issue open"
      />
    {{- end }}
    #{{ .Number }}
  </a>
  <b>{{ .Title }}</b>
  <a href="{{ .RepositoryURL }}">{{ .RepositoryPath }}</a>
</p>
{{ end }}
