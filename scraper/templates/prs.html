{{ range .Prs }}
<p>
  <a href="{{ .URL }}">
    {{- if eq .State "closed" -}}
      <picture><img
        src="https://raw.githubusercontent.com/carlos-algms/carlos-algms/refs/heads/main/images/pr-closed.svg"
        width="20"
        height="20"
        alt="pr closed"
        title="PR closed"
      /></picture>
    {{- else -}}
      <picture><img
        src="https://raw.githubusercontent.com/carlos-algms/carlos-algms/refs/heads/main/images/pr-open.svg"
        width="20"
        height="20"
        alt="pr open"
        title="PR open"
      /></picture>
    {{- end }}
    #{{ .Number }}
  </a>
  <b>{{ .Title }}</b>
  <a href="{{ .RepositoryURL }}">{{ .RepositoryPath }}</a>
</p>
{{ end }}
